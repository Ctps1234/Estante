# ─────────────────────────────────────────────────────────────────────────────
# Build do APK (debug + release)
#
# Quando roda:
#   • Push na main e PRs → compila e publica os APKs como artefato do workflow
#   • Tag v* (ex.: v1.0)  → além disso, cria um GitHub Release com os APKs
#   • Actions ▸ Build APK ▸ Run workflow → execução manual
#
# Assinatura do APK de release (opcional):
#   Se os secrets abaixo estiverem configurados no repositório, o APK de release
#   é assinado com a sua chave; senão, é assinado com a chave de debug
#   (instalável para testes, mas não serve para publicar na Play Store):
#     ANDROID_KEYSTORE_BASE64    → base64 do arquivo .jks  (base64 -w0 chave.jks)
#     ANDROID_KEYSTORE_PASSWORD  → senha do keystore
#     ANDROID_KEY_ALIAS          → alias da chave
#     ANDROID_KEY_PASSWORD       → senha da chave
# ─────────────────────────────────────────────────────────────────────────────

name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

# Cancela execuções anteriores do mesmo branch/PR (economiza minutos de CI)
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# Necessário apenas para criar o GitHub Release em tags (forks são rebaixados
# automaticamente pelo GitHub para somente leitura)
permissions:
  contents: write

jobs:
  build:
    name: Compilar APK (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cache das dependências do Gradle — os builds seguintes ficam bem mais rápidos
      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      # Se os secrets de assinatura existirem, cria keystore.properties + .jks na
      # raiz. O app/build.gradle.kts detecta o arquivo e assina o release com a
      # sua chave; sem ele, o release cai para a chave de debug.
      - name: Preparar keystore de release (opcional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Secrets de assinatura não configurados — o APK de release será assinado com a chave de debug."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Keystore de release configurado."

      # O runner do GitHub já vem com o Android SDK (API 34 e build-tools inclusos)
      - name: Compilar APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Renomear APKs com a versão
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk     "Estante-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "Estante-v${VERSION}-release.apk"
          ls -lh Estante-*.apk

      - name: Publicar APKs como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: Estante-APK
          path: Estante-*.apk
          if-no-files-found: error
          retention-days: 30

      # Em tags v* (ex.: git tag v1.0 && git push origin v1.0) cria um Release
      # com os dois APKs anexados.
      - name: Criar GitHub Release com os APKs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Estante-*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
